services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tracelens
      POSTGRES_PASSWORD: tracelens
      POSTGRES_DB: tracelens
    ports:
      - "5432:5432"
    volumes:
      - tracelens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d tracelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - tracelens_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://tracelens:tracelens@postgres:5432/tracelens
      REDIS_URL: redis://redis:6379/0
      TRACELENS_CONFIG_OVERLAY_PATH: /config/overlay.yaml
      # When hosting dashboard on Vercel, add its origin here (comma-separated).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./config/overlay.yaml:/config/overlay.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  demo-seed:
    profiles: ["demo"]
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
    environment:
      TRACELENS_BASE_URL: http://api:8000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-change-me-in-production}
    command: >
      sh -c "pip install -q httpx && python scripts/seed_demo.py"
    depends_on:
      api:
        condition: service_started

  eval-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m tracelens.workers.eval_worker
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://tracelens:tracelens@postgres:5432/tracelens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TRACELENS_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  trace-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m tracelens.workers.trace_worker
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://tracelens:tracelens@postgres:5432/tracelens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  tracelens_pgdata:
  tracelens_redisdata: