[project]
name = "tracelens"
version = "0.1.0"
description = "Self-hostable LLM gateway with observability and cost optimization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.6.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=43.0.0",
    "pgvector>=0.3.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "../sdk/python"]
markers = [
    "integration: requires Postgres (TRACELENS_INTEGRATION_TESTS=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tracelens"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "asyncpg.*",
    "argon2.*",
    "cryptography.*",
    "fakeredis.*",
    "pgvector.*",
    "sentence_transformers.*",
    "prometheus_client.*",
]
ignore_missing_imports = true